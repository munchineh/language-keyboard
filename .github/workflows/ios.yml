# Builds the iOS app (companion app + keyboard extension) on every push that
# touches app/. Runs the unit tests, then commits the generated
# app/LanguageKeyboard.xcodeproj back so the Mac can open it without Terminal.
# TestFlight upload comes later, once the App Store Connect API key is in
# the repo secrets (see docs/PROJECT.md).

name: iOS build

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Xcode version
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate --spec app/project.yml

      - name: Build for Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project app/LanguageKeyboard.xcodeproj \
            -scheme LanguageKeyboard \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project app/LanguageKeyboard.xcodeproj \
            -scheme LanguageKeyboard \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Unit tests
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in sorted(d, reverse=True) if 'iOS' in r for x in d[r] if x['name'].startswith('iPhone')))")
          echo "Simulator: $DEVICE_ID"
          xcodebuild test \
            -project app/LanguageKeyboard.xcodeproj \
            -scheme LanguageKeyboard \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Commit generated Xcode project
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/LanguageKeyboard.xcodeproj
          if git diff --cached --quiet; then
            echo "Xcode project unchanged"
          else
            git commit -m "Regenerate Xcode project [skip ci]"
            git push
          fi
